# Install:
#   sudo cp nginx-xhblogs.conf /etc/nginx/sites-available/xhblogs
#   sudo ln -sf /etc/nginx/sites-available/xhblogs /etc/nginx/sites-enabled/xhblogs
#   sudo nginx -t && sudo systemctl reload nginx
# Then (after DNS works):
#   sudo certbot --nginx -d example.com -d www.example.com
#
# Replace example.com with your domain. Until Certbot runs, HTTP-only is fine for a trial host.

upstream xhblogs_node {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name example.com www.example.com;

    client_max_body_size 16m;

    location / {
        proxy_pass http://xhblogs_node;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 60s;
    }
}
